version: '3.8'

services:
  backend:
    build: ./backend
    container_name: incident-tracker-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - incident-network

  frontend:
    build: ./frontend
    container_name: incident-tracker-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - incident-network

networks:
  incident-network:
    driver: bridge
